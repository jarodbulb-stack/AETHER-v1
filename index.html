<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AETHER Mission Command System</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
height:100vh;
overflow:hidden;
font-family:Segoe UI,Arial,sans-serif;
background:radial-gradient(circle at center,#061a3a 0%,#020814 70%,#01040a 100%);
color:white;
}
.stars{
position:fixed;inset:0;
background-image:
radial-gradient(2px 2px at 20% 30%,rgba(255,255,255,.8),transparent),
radial-gradient(1px 1px at 70% 20%,rgba(255,255,255,.7),transparent),
radial-gradient(2px 2px at 80% 70%,rgba(255,255,255,.8),transparent),
radial-gradient(1px 1px at 40% 80%,rgba(255,255,255,.6),transparent);
opacity:.5;
}
.container{
position:relative;
height:100vh;
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
z-index:2;
}
.logo{
position:relative;
width:min(80vw,1100px);
margin-top:25px;
}
.logo img{width:100%;display:block}

/* ---- Animated orbit overlay. The original image's static ring was
       erased (aether-banner-clean.png) so this fully-live ring and
       glow can rotate and pulse with nothing underneath to visually
       clash with. Coordinates are measured directly against the
       banner's real pixel dimensions (1315x223) so this stays
       aligned at any responsive size. ---- */
.logo-orbit-overlay{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}
.orbit-ring-group{
  transform-origin:220.5px 106.5px;
  animation:orbitSpin 14s linear infinite;
}
@keyframes orbitSpin{
  from{ transform:rotate(0deg); }
  to{ transform:rotate(360deg); }
}
.orbit-ring-line{
  animation:ringGlow 3.2s ease-in-out infinite;
  transform-box:fill-box;
  transform-origin:center;
}
@keyframes ringGlow{
  0%,100%{ opacity:.5; filter:drop-shadow(0 0 1px #4ad4ff); }
  50%{ opacity:1; filter:drop-shadow(0 0 14px #4ad4ff) drop-shadow(0 0 30px #4ad4ff) drop-shadow(0 0 46px #4ad4ff); }
}
.triangle-glow{
  animation:triangleGlow 3.2s ease-in-out infinite;
  transform-box:fill-box;
  transform-origin:center;
}
@keyframes triangleGlow{
  0%,100%{ opacity:.18; transform:scale(0.6); }
  50%{ opacity:.85; transform:scale(1.9); }
}
.orbit-dot{
  animation:orbitPulse 2.6s ease-in-out infinite;
  transform-box:fill-box;
  transform-origin:center;
}
.orbit-dot.d2{ animation-delay:.5s; }
.orbit-dot.d3{ animation-delay:1s; }
.orbit-dot.d4{ animation-delay:1.5s; }
@keyframes orbitPulse{
  0%,100%{ opacity:.55; transform:scale(0.7); }
  50%{ opacity:1; transform:scale(1.15); }
}

.welcome{
margin-top:40px;
font-size:clamp(28px,3vw,60px);
font-style:italic;
color:#dbe8ff;
text-shadow:0 0 20px rgba(80,180,255,.6);
}
.sub{
margin-top:15px;
font-size:clamp(20px,2vw,42px);
font-style:italic;
color:#b9d2ff;
}
.secure{
margin-top:55px;
letter-spacing:4px;
font-size:clamp(12px,1vw,18px);
color:#88a7d6;
}
.earth{
position:absolute;
bottom:0;
left:0;
width:100%;
z-index:1;
}
.earth img{
width:100%;
display:block;
}
.enter-btn{
position:absolute;
bottom:8%;
left:50%;
transform:translateX(-50%);
z-index:3;
padding:22px 120px;
font-size:clamp(22px,2vw,40px);
letter-spacing:10px;
color:white;
background:rgba(0,20,60,.35);
border:2px solid #00bfff;
border-radius:18px;
cursor:pointer;
box-shadow:0 0 25px rgba(0,191,255,.7);
backdrop-filter:blur(6px);
animation:enterPulse 2.4s ease-in-out infinite;
}
@keyframes enterPulse{
  0%,100%{
    box-shadow:0 0 12px rgba(0,191,255,.45), 0 0 24px rgba(0,191,255,.25);
    border-color:#0091c4;
  }
  50%{
    box-shadow:0 0 30px rgba(0,191,255,.9), 0 0 60px rgba(0,191,255,.6), 0 0 90px rgba(0,191,255,.35);
    border-color:#5fe0ff;
  }
}
.enter-btn:hover{
transform:translateX(-50%) scale(1.04);
box-shadow:0 0 40px rgba(0,191,255,1);
animation-play-state:paused;
}
</style>
</head>
<body>
<div class="stars"></div>

<div class="container">
<div class="logo">
<img src="aether-banner-clean.png" alt="AETHER">

<svg class="logo-orbit-overlay" viewBox="0 0 1315 223" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="triGlowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ad4ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#4ad4ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4ad4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle class="triangle-glow" cx="220.5" cy="106.5" r="58" fill="url(#triGlowGrad)"/>
  <g class="orbit-ring-group">
    <circle class="orbit-ring-line" cx="220.5" cy="106.5" r="82.5" fill="none" stroke="#4ad4ff"
      stroke-width="2.4" stroke-dasharray="4 10"/>
    <circle class="orbit-dot d1" cx="220.5" cy="24.0" r="4" fill="#4ad4ff"/>
    <circle class="orbit-dot d2" cx="300.2" cy="127.9" r="4" fill="#4ad4ff"/>
    <circle class="orbit-dot d3" cx="147.0" cy="144.0" r="4" fill="#4ad4ff"/>
    <circle class="orbit-dot d4" cx="294.0" cy="144.0" r="4" fill="#4ad4ff"/>
  </g>
</svg>
</div>

<div class="secure">YOUR DATA IS SECURE. ENCRYPTED. PRIVATE.</div>
</div>

<div class="earth">
<img src="earth.png" alt="Earth Horizon">
<canvas id="earthFlickerCanvas" style="position:absolute;top:0;left:0;pointer-events:none;"></canvas>
</div>

<button class="enter-btn" onclick="window.__aetherEnter()">ENTER</button>

<script src="aether-music.js"></script>
